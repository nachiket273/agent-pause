name: Bug report
description: Report a reproducible defect in Agent Pause.
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: "Please do not include secrets, API keys, or private agent data."
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the unexpected behaviour.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Create an execution...
        2. Request pause...
        3. Observe...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Agent Pause version / commit
      placeholder: "0.1.0-alpha or commit SHA"
  - type: dropdown
    id: runtime
    attributes:
      label: Runtime / integration
      options:
        - Custom Python reference runner
        - LangGraph
        - CrewAI
        - Other
        - Not applicable
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "e.g. 3.12.2"
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or traceback
      description: Redact credentials, tokens, personal data, and sensitive prompts.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for duplicates.
          required: true
        - label: I removed secrets and sensitive information.
          required: true
